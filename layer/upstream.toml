# The upstream ArmorPaint commit this layer is tested against, and the toolchain it builds with.
# Moved by layer/tools/watch.py --apply, only after the build, the smoke test (and Singerie's pipeline plugin test)
# passed on the new commit; by hand: a green smoke test and a reviewed api_snapshot.h (smoke.py --update-snapshot).

[upstream]
repository = "https://github.com/armory3d/armorpaint"
branch = "main"
commit = "49e90336886b40e78678b4da5b02f4ccb8be255c"
date = "2026-10-29"
# ArmorPaint's manifest_version at that commit (its About box shows it).
version = "1.1alpha"

[toolchain]
# Upstream builds with clang (Visual Studio's ClangCL toolset on Windows; its project notes clang 19 for one optional
# flag). Visual Studio 2022's clang-cl 16.0.5 built 4c06b93 unchanged (5 October 2026) and
# 49e9033 with the layer's hook patch (31 October 2026): members' builds.
# Without clang, the build tool switches a copy of the project to MSVC (v143) and makes three mechanical syntax
# changes in that copy only (layer/README.md > Building on Windows): scratch builds for tests, never for members.
windows = "Visual Studio 2022 with C++ Clang tools (ClangCL, clang-cl 16.0.5 checked); v143 for scratch builds only"
amake = "base/tools/bin/windows_x64/amake.exe (upstream's own, at the pinned commit)"
python = "3.11 or newer, standard library only (build, smoke test, watch, packaging)"
